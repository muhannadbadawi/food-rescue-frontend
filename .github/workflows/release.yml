name: Build and Upload Expo Android APK

on:
  release:
    types: [published]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Set Expo token
        run: echo "EXPO_TOKEN=${{ secrets.EXPO_TOKEN }}" >> $GITHUB_ENV

      - name: Build Android APK
        run: |
          eas build --platform android --profile production --non-interactive --output-json > build.json

      - name: Get APK URL
        id: get_apk
        run: |
          APK_URL=$(jq -r '.artifacts.buildUrl' build.json)
          echo "APK_URL=$APK_URL" >> $GITHUB_ENV

      - name: Upload APK to Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ env.APK_URL }}
          tag_name: ${{ github.ref_name }}
