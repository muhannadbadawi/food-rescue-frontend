name: Build and Upload Expo APK & IPA

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        platform: [android, ios]

    steps:
      # 1️⃣ Checkout repository
      - uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Install EAS CLI
      - name: Install EAS CLI
        run: npm install -g eas-cli

      # 5️⃣ Build APK/IPA on Expo cloud
      - name: Build App
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform ${{ matrix.platform }} --profile production --non-interactive --output-json > build.json

      # 6️⃣ Download artifact (APK or IPA)
      - name: Download Artifact
        run: |
          FILE_URL=$(jq -r '.buildUrl' build.json)
          if [ "${{ matrix.platform }}" = "android" ]; then
            curl -L $FILE_URL --output app-release.apk
          else
            curl -L $FILE_URL --output app-release.ipa
          fi

      # 7️⃣ Upload to GitHub Release
      - name: Upload to Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ matrix.platform == 'android' && 'app-release.apk' || 'app-release.ipa' }}
          tag_name: ${{ github.ref_name }}
